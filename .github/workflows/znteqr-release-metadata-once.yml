name: Sync follow-up release metadata once

on:
  push:
    branches:
      - chore/znteqr-deep-cleanup-followup

permissions:
  contents: write

jobs:
  sync-release-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/znteqr-deep-cleanup-followup
          fetch-depth: 0

      - name: Sync package versions and changelog
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = '3.34.4';

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.version = version;
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);

          const packageLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          packageLock.version = version;
          if (packageLock.packages?.['']) packageLock.packages[''].version = version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(packageLock, null, 2)}\n`);

          const changelogPath = 'CHANGELOG.md';
          const changelog = fs.readFileSync(changelogPath, 'utf8');
          const marker = '## [Unreleased]\n';
          if (!changelog.includes(marker)) throw new Error('Missing [Unreleased] marker');
          if (!changelog.includes('## [3.34.4] - 2026-09-15')) {
            const section = [
              '',
              '## [3.34.4] - 2026-09-15',
              '',
              '### Changed',
              '',
              '- Completed the ZNTEQR deep-cleanup follow-up by renaming remaining active internal runtime identifiers and moving the Help Center welcome article to the canonical `welcome-to-znteqr` slug while preserving the legacy URL with a permanent redirect.',
              '',
            ].join('\n');
            fs.writeFileSync(changelogPath, changelog.replace(marker, `${marker}${section}`));
          }
          NODE

          rm .github/workflows/znteqr-release-metadata-once.yml

      - name: Commit synchronized metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md .github/workflows/znteqr-release-metadata-once.yml
          git commit -m "chore(release): bump version to 3.34.4"
          git push origin HEAD:chore/znteqr-deep-cleanup-followup

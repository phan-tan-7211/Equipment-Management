name: Production Release Readiness

# After a merge to `main`, applies pending Supabase migrations to production,
# verifies schema_migrations alignment, waits for the matching Vercel deployment,
# promotes it to production, then deploys Edge Functions last.
#
# Source of truth:
#   - Non-secret deployment targets: .github/deployment-targets.json
#   - Authentication: GitHub Actions secrets
# Required secrets:
#   - SUPABASE_ACCESS_TOKEN
#   - SUPABASE_DB_PASSWORD
#   - VERCEL_TOKEN
#
# Runtime application variables remain managed natively in Vercel and Supabase.
# 1Password is not part of this production release path.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-release-readiness:
    name: Migrate, verify schema, promote Vercel, deploy edge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Load production deployment targets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.github/deployment-targets.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const production = config.production || {};
          const values = {
            SUPABASE_PROJECT_REF: production.supabaseProjectRef,
            VERCEL_TEAM_ID: production.vercelTeamId,
            VERCEL_PROJECT_ID: production.vercelProjectId,
          };
          for (const [name, value] of Object.entries(values)) {
            if (typeof value !== 'string' || !value.trim()) {
              throw new Error(`${name} is missing from ${path}`);
            }
          }
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            Object.entries(values).map(([name, value]) => `${name}=${value.trim()}\n`).join(''),
          );
          console.log(`Loaded production deployment targets from ${path}`);
          NODE

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.72.8

      - name: Verify release configuration
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for var in \
            SUPABASE_PROJECT_REF \
            VERCEL_TEAM_ID \
            VERCEL_PROJECT_ID \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_PASSWORD \
            VERCEL_TOKEN; do
            val="${!var:-}"
            if [[ -z "$val" ]]; then
              echo "::error title=production-release-readiness::$var is empty. Check .github/deployment-targets.json or GitHub Actions secrets."
              fail=1
            fi
          done
          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi

      - name: Apply migrations to production
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Linking production Supabase project..."
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          echo "::notice::Pushing migrations (include-all)..."
          supabase db push --include-all --yes

      - name: Strict production schema drift check
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
          GITHUB_BASE_REF: ''
          SCHEMA_DRIFT_STRICT: 'true'
        run: node .github/scripts/check-schema-drift.js

      - name: Wait for Vercel deployment (main, READY)
        id: wait_vercel
        env:
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node dev/release/wait-for-vercel-deployment.mjs >> "$GITHUB_OUTPUT"

      - name: Promote Vercel deployment to production
        env:
          VERCEL_DEPLOYMENT_URL: ${{ steps.wait_vercel.outputs.deployment_url }}
          VERCEL_DEPLOYMENT_ID: ${{ steps.wait_vercel.outputs.deployment_id }}
          GITHUB_SHA: ${{ github.sha }}
          VERCEL_PROMOTE_TIMEOUT: 5m
        run: node dev/release/promote-vercel-production.mjs

      - name: Deploy edge functions to production
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Deploying Edge Functions to production ($SUPABASE_PROJECT_REF)..."
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Release readiness summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Production release readiness"
            echo ""
            echo "- **Supabase:** migrations applied; strict schema drift check passed; Edge Functions deployed."
            echo "- **Vercel:** main deployment READY and **promoted to production** (\`eqr.zinitek.com\`)."
            echo "- **Deployment:** ${{ steps.wait_vercel.outputs.deployment_url }}"
            echo ""
            echo "Deployment targets came from versioned config-as-code; authentication came from GitHub Secrets."
          } >> "$GITHUB_STEP_SUMMARY"

name: Capacitor Android Trial APK

on:
  push:
    branches:
      - test/capacitor-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://wgynakhoppqkrutnslmv.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_5pStEJfSD1p_Nui6ZAA5Cw_ZuJH--fn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install web dependencies
        run: npm ci

      # IMPORTANT: do not use --no-save here. Capacitor discovers native plugins
      # from the project's package dependency graph when generating/syncing Android.
      # This transiently updates package.json in the CI workspace only; the branch
      # itself remains clean while @capacitor/app is correctly linked natively.
      - name: Install Capacitor 8 and native App plugin
        run: >-
          npm install --package-lock=false
          @capacitor/core@8
          @capacitor/cli@8
          @capacitor/android@8
          @capacitor/app@8

      - name: Build Vite app
        run: npm run build

      - name: Use SPA app shell for Capacitor
        run: |
          test -f dist/app-shell.html
          cp dist/app-shell.html dist/index.html

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets and native plugins into Android
        run: npx cap sync android

      - name: Verify native App plugin is linked
        run: |
          echo "Checking generated Android project for @capacitor/app..."
          if ! grep -R --line-number --fixed-strings "capacitor-app" android --exclude='*.apk' --exclude='*.jar' --exclude='*.class' | head -20; then
            echo "ERROR: @capacitor/app was not linked into the Android project."
            exit 1
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/equipment-management-capacitor-debug.apk
          sha256sum artifacts/equipment-management-capacitor-debug.apk > artifacts/equipment-management-capacitor-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: equipment-management-capacitor-debug-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

name: Release Metadata Fix

on:
  push:
    branches:
      - i18n-equipment-final-audit-20260911

permissions:
  contents: write

jobs:
  bump-release-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: i18n-equipment-final-audit-20260911

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x

      - name: Bump package and lockfile version
        run: npm version 3.32.1 --no-git-tag-version

      - name: Add 3.32.1 changelog entry
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'CHANGELOG.md';
          const current = fs.readFileSync(path, 'utf8');
          if (current.includes('## [3.32.1]')) process.exit(0);
          const marker = '## [Unreleased]\n';
          const release = [
            '## [3.32.1] - 2026-09-12',
            '',
            '### Changed',
            '',
            '- **Equipment localization** — Equipment workflows now support Vietnamese, English, and Korean across lists, details, forms, QR scanning, PM, media, parts, filters, sorting, working hours, and equipment groups.',
            '',
          ].join('\n');
          if (!current.includes(marker)) throw new Error('Missing [Unreleased] section');
          fs.writeFileSync(path, current.replace(marker, `${marker}\n${release}`), 'utf8');
          NODE

      - name: Commit release metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Release metadata already up to date"
            exit 0
          fi
          git commit -m "chore(release): bump version to 3.32.1"
          git push origin HEAD:i18n-equipment-final-audit-20260911

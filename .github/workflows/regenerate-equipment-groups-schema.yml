name: Regenerate Equipment Groups Schema Reference

on:
  push:
    branches:
      - asset-groups-management
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/regenerate-equipment-groups-schema.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asset-groups-management
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: npx supabase start

      - name: Rebuild migration chain
        run: npx supabase db reset --local --yes

      - name: Regenerate schema reference
        run: npx supabase db dump --local -f supabase/current_schema.sql

      - name: Commit regenerated schema reference
        run: |
          if git diff --quiet -- supabase/current_schema.sql; then
            echo "Schema reference already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/current_schema.sql
          git commit -m "chore(db): refresh current schema reference"
          git push origin HEAD:asset-groups-management

name: Temporary release metadata bump

on:
  push:
    branches:
      - chore/centralize-production-config

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/centralize-production-config
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Bump package metadata to 3.34.5
        run: npm version 3.34.5 --no-git-tag-version --ignore-scripts

      - name: Add changelog entry
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'CHANGELOG.md';
          let text = fs.readFileSync(path, 'utf8');
          if (!text.includes('## [3.34.5]')) {
            const marker = '## [Unreleased]\n';
            const entry = '\n## [3.34.5] - 2026-09-15\n\n### Changed\n\n- Centralized production deployment configuration in GitHub, removed hard-coded Vercel target IDs from release tooling, and removed 1Password from the Vercel production release path.\n';
            if (!text.includes(marker)) throw new Error('Unreleased changelog marker not found');
            text = text.replace(marker, marker + entry);
            fs.writeFileSync(path, text);
          }
          NODE

      - name: Commit generated release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md
          git diff --cached --check
          git commit -m 'chore(release): bump version to 3.34.5'
          git push origin HEAD:chore/centralize-production-config

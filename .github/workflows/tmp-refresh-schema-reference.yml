name: Temporary Schema Reference Refresh

on:
  push:
    branches:
      - feat/equipment-parts-quick-add
    paths:
      - .github/workflows/tmp-refresh-schema-reference.yml

permissions:
  contents: write

jobs:
  refresh-schema-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/equipment-parts-quick-add
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Start local Supabase
        run: npx supabase start

      - name: Replay full migration chain
        run: npx supabase db reset

      - name: Regenerate schema reference
        run: npx supabase db dump --local -f supabase/current_schema.sql

      - name: Verify regenerated schema reference exists
        run: test -s supabase/current_schema.sql

      - name: Commit schema reference and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-refresh-schema-reference.yml
          git add supabase/current_schema.sql .github/workflows/tmp-refresh-schema-reference.yml
          if git diff --cached --quiet; then
            echo "No schema-reference changes were generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh schema reference"
          git push origin HEAD:feat/equipment-parts-quick-add

name: Verify Asset Groups Integration

on:
  push:
    branches:
      - asset-groups-integration
    paths:
      - 'src/**'
      - 'supabase/**'
      - '.github/workflows/verify-asset-groups-integration.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asset-groups-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci --ignore-scripts
      - name: Start local Supabase
        run: npx supabase start
      - name: Rebuild migration chain
        run: npx supabase db reset --local --yes
      - name: Regenerate schema reference
        run: npx supabase db dump --local -f supabase/current_schema.sql
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build
      - name: Commit schema reference
        run: |
          if git diff --quiet -- supabase/current_schema.sql; then
            echo "Schema reference already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/current_schema.sql
          git commit -m "chore(db): refresh schema reference"
          git push origin HEAD:asset-groups-integration

name: Temporary production variable setup

on:
  push:
    branches:
      - chore/centralize-production-config

permissions:
  actions: write
  contents: read

jobs:
  configure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Upsert repository Actions variables
        shell: bash
        run: |
          set -euo pipefail
          upsert_var() {
            local name="$1"
            local value="$2"
            local code
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
              -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPO/actions/variables/$name" \
              -d "$(jq -nc --arg name "$name" --arg value "$value" '{name:$name,value:$value}')")
            if [[ "$code" == "204" ]]; then
              echo "updated $name"
              return 0
            fi
            if [[ "$code" == "404" ]]; then
              code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$REPO/actions/variables" \
                -d "$(jq -nc --arg name "$name" --arg value "$value" '{name:$name,value:$value}')")
              if [[ "$code" == "201" ]]; then
                echo "created $name"
                return 0
              fi
            fi
            echo "::error::Failed to upsert $name (HTTP $code): $(cat /tmp/resp.json)"
            return 1
          }

          upsert_var SUPABASE_PROJECT_REF wgynakhoppqkrutnslmv
          upsert_var VERCEL_TEAM_ID team_XxAHyO9mYzy1uak2K2CZycYt
          upsert_var VERCEL_PROJECT_ID prj_oAZbIzz9qDeCQyytupGp5hBHjjU4

name: Temporary Cut 3.33.0

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-cut-3-33-0.yml'

permissions:
  contents: write

jobs:
  cut-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cut release metadata
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" = "3.33.0" ]; then
            echo "Release metadata already cut."
            exit 0
          fi
          npm version 3.33.0 --no-git-tag-version
          node <<'NODE'
          const fs = require('fs');
          const path = 'CHANGELOG.md';
          let text = fs.readFileSync(path, 'utf8');
          const match = text.match(/## \[Unreleased\]\r?\n([\s\S]*?)(?=\r?\n## \[)/);
          if (!match) throw new Error('Could not locate [Unreleased] section');
          const notes = match[1].trim();
          if (!notes) throw new Error('[Unreleased] is unexpectedly empty');
          const replacement = `## [Unreleased]\n\n## [3.33.0] - 2026-09-13\n\n${notes}\n`;
          text = text.slice(0, match.index) + replacement + text.slice(match.index + match[0].length);
          fs.writeFileSync(path, text);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git diff --cached --check
          git commit -m "chore(release): cut 3.33.0"
          git push origin HEAD:preview

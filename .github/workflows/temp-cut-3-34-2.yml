name: Temp Cut 3.34.2

on:
  push:
    branches:
      - i18n/error-handling-final-v6

permissions:
  contents: write

jobs:
  cut-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n/error-handling-final-v6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bump package metadata and changelog
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" = "3.34.2" ]; then
            echo "Already at 3.34.2"
            exit 0
          fi
          npm version 3.34.2 --no-git-tag-version
          node <<'NODE'
          const fs = require('fs');
          const path = 'CHANGELOG.md';
          let text = fs.readFileSync(path, 'utf8');
          const marker = '## [Unreleased]';
          if (!text.includes(marker)) throw new Error('Missing [Unreleased] section');
          const release = `## [3.34.2] - 2026-09-15\n\n### Changed\n\n- **Localized shared error handling** — Generic error titles, fallback messages, and recovery guidance now follow the selected Vietnamese, English, or Korean language.\n\n`;
          text = text.replace(`${marker}\n`, `${marker}\n\n${release}`);
          fs.writeFileSync(path, text);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release 3.34.2"
          git push origin HEAD:i18n/error-handling-final-v6

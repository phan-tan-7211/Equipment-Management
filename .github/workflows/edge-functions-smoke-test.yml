name: Edge Functions Smoke Test

# Runs after Edge Functions are deployed to verify the most-likely
# misconfiguration mode (missing required secret) is not present.
#
# Required repo-level GitHub Actions secret:
#   SUPABASE_ANON_KEY (production anon/public key)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-functions-smoke-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-functions-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: public-google-maps-key returns 401 (not 500)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Probe public-google-maps-key
        shell: bash
        env:
          SUPABASE_URL: https://ymxkzronkhwxzcdcbnwq.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -u
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::warning::SUPABASE_ANON_KEY is not configured as a repo-level GitHub Actions secret — skipping smoke test."
            exit 0
          fi

          ENDPOINT="${SUPABASE_URL%/}/functions/v1/public-google-maps-key"
          echo "Probing $ENDPOINT (env=production)"

          HTTP=$(curl --silent --show-error --max-time 15 \
            --output /tmp/smoke-body.json \
            --write-out '%{http_code}' \
            -X POST "$ENDPOINT" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' || echo "000")

          echo "HTTP status: $HTTP"
          echo "Body (first 500 chars):"
          head -c 500 /tmp/smoke-body.json || true
          echo

          if [ "$HTTP" = "500" ]; then
            echo "::error title=Edge Function smoke test failed::public-google-maps-key returned 500. The most likely cause is a missing GOOGLE_MAPS_BROWSER_KEY secret on the production Supabase project."
            exit 1
          fi

          if [ "$HTTP" = "401" ]; then
            echo "::notice::public-google-maps-key returned 401 as expected (anon-key is not a user JWT). Function is healthy."
            exit 0
          fi

          echo "::warning::Unexpected HTTP $HTTP from public-google-maps-key (expected 401). Function is reachable but the response shape changed."
          exit 0

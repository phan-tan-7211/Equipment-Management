name: Temporary 3.33 Changelog Repair

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-fix-3-33-changelog.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Restore full changelog and add section heading
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:CHANGELOG.md > CHANGELOG.md
          python - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          s = p.read_text()
          needle = '## [3.33.0] - 2026-09-13\n\n'
          if needle not in s:
              raise SystemExit('3.33.0 heading not found')
          s = s.replace(needle, needle + '### Changed\n\n', 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'fix(release): classify 3.33.0 public release notes'
          git push origin HEAD:preview

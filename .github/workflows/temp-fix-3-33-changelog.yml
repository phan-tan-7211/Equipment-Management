name: Temporary 3.33 Changelog Repair

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/temp-fix-3-33-changelog.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 10
      - name: Restore full changelog and normalize 3.33.0 heading
        shell: bash
        run: |
          set -euo pipefail
          git show 068f15ea8615c1602d57163d5c373fd85ea994ff:CHANGELOG.md > CHANGELOG.md
          python - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          s = p.read_text()
          s = s.replace('## [3.33.0] - 2026-09-13\n\n### Changed\n\n### Changed\n\n', '## [3.33.0] - 2026-09-13\n\n### Changed\n\n', 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'fix(release): restore full 3.33.0 changelog'
          git push origin HEAD:preview

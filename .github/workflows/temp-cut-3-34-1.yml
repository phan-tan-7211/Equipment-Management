name: Temp Cut 3.34.1

on:
  push:
    branches:
      - i18n/final-hardcoded-audit-main

permissions:
  contents: write

jobs:
  cut-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n/final-hardcoded-audit-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Bump package metadata and changelog
        shell: bash
        run: |
          set -euo pipefail
          npm version 3.34.1 --no-git-tag-version
          node <<'NODE'
          const fs = require('fs');
          const path = 'CHANGELOG.md';
          let text = fs.readFileSync(path, 'utf8');
          const marker = '## [Unreleased]\n';
          const release = `## [3.34.1] - 2026-09-15\n\n### Changed\n\n- **VI/EN/KO localization completion** — Remaining user-facing work-order, PM, note, image, loading, accessibility, cookie-consent, and equipment feedback now follows the selected Vietnamese, English, or Korean language without changing stored business data.\n\n`;
          if (!text.includes('## [3.34.1]')) {
            text = text.replace(marker, `${marker}\n${release}`);
          }
          fs.writeFileSync(path, text);
          NODE
          git rm .github/workflows/temp-cut-3-34-1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release 3.34.1 i18n completion"
          git push origin HEAD:i18n/final-hardcoded-audit-main

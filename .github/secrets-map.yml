version: 2

# Production CI/CD no longer uses 1Password.
# This file documents ownership only; it never contains secret values.
production:
  github_environment: production

  variables:
    - SUPABASE_PROJECT_REF

  secrets:
    - SUPABASE_ACCESS_TOKEN
    - SUPABASE_DB_PASSWORD

runtime_sources:
  cloudflare:
    owner: Cloudflare Pages project environment variables
    note: Frontend/build/runtime variables are managed directly in Cloudflare Pages.
  supabase:
    owner: Supabase Secrets / project configuration
    note: Edge Function and backend runtime secrets are managed directly in Supabase.

policy:
  - Do not commit secret values.
  - Do not store production deployment tokens in 1Password for CI/CD.
  - Production workflows must fail closed when required GitHub variables or secrets are missing.
